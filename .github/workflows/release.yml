name: Release

# Trigger Configuration: Only run on version tags
on:
  push:
    tags:
      - 'v*'              # Triggers on tags like v0.1.4, v1.0.0, etc.

# Global Environment Variables
env:
  CARGO_TERM_COLOR: always

# Job Definitions: Single job for release creation
# Validation is handled by dedicated CI workflows (ci-linux.yml, ci-windows.yml, ci-macos.yml)
jobs:
  # Create GitHub releases for missing tags
  create-releases:
    name: Create GitHub Releases
    runs-on: ubuntu-22.04
    
    # Permissions needed for creating releases
    permissions:
      contents: write                  # Required to create releases
      
    steps:
      # Step 1: Get the source code with full history
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0              # Fetch full history for release notes generation
          
      # Step 2: Install GitHub CLI
      - name: Install GitHub CLI
        run: |
          # Install GitHub CLI (available in ubuntu-22.04)
          type gh >/dev/null 2>&1 || {
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh
          }
          
      # Step 3: Identify missing releases and create them in chronological order
      - name: Create missing releases
        run: |
          echo "=== Checking for missing releases ==="
          
          # Get all tags sorted by version (chronological order)
          ALL_TAGS=$(git tag -l 'v*' | sort -V)
          
          if [ -z "$ALL_TAGS" ]; then
            echo "No version tags found"
            exit 0
          fi
          
          echo "Found tags: $ALL_TAGS"
          
          # Get existing releases
          EXISTING_RELEASES=$(gh release list --limit 100 | cut -f1 || echo "")
          echo "Existing releases: $EXISTING_RELEASES"
          
          # Function to generate release notes for a specific tag
          generate_release_notes() {
            local TAG=$1
            local PREV_TAG=$2
            local OUTPUT_FILE=$3
            
            echo "Generating release notes for $TAG (previous: $PREV_TAG)"
            
            # Determine commit range
            if [ -n "$PREV_TAG" ]; then
              COMMIT_RANGE="$PREV_TAG..$TAG"
              echo "Using commit range: $COMMIT_RANGE"
            else
              # First tag - use all commits up to this tag
              COMMIT_RANGE=$(git rev-list --reverse HEAD | head -1)"..$TAG"
              echo "First tag - using range from first commit to $TAG"
            fi
            
            # Create release notes file
            cat > "$OUTPUT_FILE" << 'EOF'
          ## Changes in this Release
          
          EOF
            
            # Parse conventional commits and categorize (strip prefixes since headers indicate type)
            echo "### Added" >> "$OUTPUT_FILE"
            git log --pretty=format:"%s" $COMMIT_RANGE 2>/dev/null | grep "^feat" | sed -E 's/^[a-z]+(!)?(\([^)]*\))?:[[:space:]]*//' | sed 's/^/- /' >> "$OUTPUT_FILE" || echo "- No new features" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"
            
            echo "### Fixed" >> "$OUTPUT_FILE"
            git log --pretty=format:"%s" $COMMIT_RANGE 2>/dev/null | grep "^fix" | sed -E 's/^[a-z]+(!)?(\([^)]*\))?:[[:space:]]*//' | sed 's/^/- /' >> "$OUTPUT_FILE" || echo "- No bug fixes" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"
            
            echo "### Performance" >> "$OUTPUT_FILE"
            git log --pretty=format:"%s" $COMMIT_RANGE 2>/dev/null | grep "^perf" | sed -E 's/^[a-z]+(!)?(\([^)]*\))?:[[:space:]]*//' | sed 's/^/- /' >> "$OUTPUT_FILE" || echo "- No performance improvements" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"
            
            echo "### Documentation" >> "$OUTPUT_FILE"
            git log --pretty=format:"%s" $COMMIT_RANGE 2>/dev/null | grep "^docs" | sed -E 's/^[a-z]+(!)?(\([^)]*\))?:[[:space:]]*//' | sed 's/^/- /' >> "$OUTPUT_FILE" || echo "- No documentation changes" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"
            
            echo "### Breaking Changes" >> "$OUTPUT_FILE"
            # Extract BREAKING CHANGE: content from commit bodies, or use stripped subjects
            BREAKING_FOUND=false
            while IFS= read -r commit_hash; do
              if [ -n "$commit_hash" ]; then
                SUBJECT=$(git log --format="%s" -n 1 "$commit_hash" 2>/dev/null)
                BODY=$(git log --format="%b" -n 1 "$commit_hash" 2>/dev/null)
                
                if [[ "$SUBJECT" =~ ! ]]; then
                  # Always strip conventional prefix from subject for breaking changes
                  STRIPPED=$(echo "$SUBJECT" | sed -E 's/^[a-z]+(!)?(\([^)]*\))?:[[:space:]]*//')
                  
                  if [[ "$BODY" =~ BREAKING\ CHANGE:[[:space:]]*(.*) ]]; then
                    # Extract text after "BREAKING CHANGE:"
                    echo "- ${BASH_REMATCH[1]}" >> "$OUTPUT_FILE"
                  else
                    # Fallback to stripped subject (conventional prefix already removed)
                    echo "- $STRIPPED" >> "$OUTPUT_FILE"
                  fi
                  BREAKING_FOUND=true
                fi
              fi
            done <<< "$(git rev-list $COMMIT_RANGE 2>/dev/null || true)"
            
            if [ "$BREAKING_FOUND" = false ]; then
              echo "- No breaking changes" >> "$OUTPUT_FILE"
            fi
            echo "" >> "$OUTPUT_FILE"
            
            echo "### Other Changes" >> "$OUTPUT_FILE"
            git log --pretty=format:"%s" $COMMIT_RANGE 2>/dev/null | grep -v "^feat\|^fix\|^perf\|^docs\|^chore.*release" | sed -E 's/^[a-z]+(!)?(\([^)]*\))?:[[:space:]]*//' | sed 's/^/- /' >> "$OUTPUT_FILE" || echo "- No other changes" >> "$OUTPUT_FILE"
            
            # Clean up empty sections
            sed -i '/^### [A-Za-z]*$/N;/\n- No /d' "$OUTPUT_FILE" || true
            
            echo "Generated release notes for $TAG:"
            cat "$OUTPUT_FILE"
          }
          
          # Process tags in chronological order
          PREV_TAG=""
          CREATED_COUNT=0
          
          for TAG in $ALL_TAGS; do
            echo ""
            echo "=== Processing tag: $TAG ==="
            
            # Check if release already exists
            if echo "$EXISTING_RELEASES" | grep -q "^$TAG$"; then
              echo "Release for $TAG already exists, skipping"
            else
              echo "Creating release for $TAG"
              
              # Extract version (remove 'v' prefix)
              VERSION=${TAG#v}
              
              # Generate release notes
              NOTES_FILE="release_notes_$TAG.md"
              generate_release_notes "$TAG" "$PREV_TAG" "$NOTES_FILE"
              
              # Get tag date for proper chronological ordering
              TAG_DATE=$(git log -1 --format=%ai "$TAG" 2>/dev/null || date -Iseconds)
              
              # Create the release
              if gh release create "$TAG" \
                --title "Release $VERSION" \
                --notes-file "$NOTES_FILE" \
                --verify-tag; then
                echo "Successfully created release for $TAG"
                CREATED_COUNT=$((CREATED_COUNT + 1))
                
                # Small delay to avoid rate limiting
                sleep 2
              else
                echo "Failed to create release for $TAG"
              fi
              
              # Clean up notes file
              rm -f "$NOTES_FILE"
            fi
            
            # Update previous tag for next iteration
            PREV_TAG=$TAG
          done
          
          echo ""
          echo "=== Summary ==="
          echo "Created $CREATED_COUNT new releases"
          
          if [ $CREATED_COUNT -gt 0 ]; then
            echo "Successfully created releases for missing tags!"
            echo "All releases are now available in chronological order."
          else
            echo "All tags already have corresponding releases."
          fi
          
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


